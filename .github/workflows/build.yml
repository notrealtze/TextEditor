name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/actions-runner-share/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle Wrapper Scaffolding
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Run Production Release Compile with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Build Artifact APK to Run Summary
      uses: actions/upload-artifact@v4
      with:
        name: Native-TextEditor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
